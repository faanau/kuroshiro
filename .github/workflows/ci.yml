name: CI

# Upstream had Travis, which stopped running for open-source repos years
# ago; there has been no CI since. The suite is fast, so run it on every
# supported Node.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # No `cache: npm` — upstream gitignores package-lock.json, so
          # there is no lockfile in the repo and setup-node errors out
          # with "Dependencies lock file is not found" before installing
          # anything. Committing a lockfile is a separate decision from
          # turning CI on.
      # `npm install` rather than `npm ci` for the same reason.
      - run: npm install
      - run: npx eslint src test
      - run: npx jest
